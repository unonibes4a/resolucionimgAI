<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor de Imágenes Avanzado - 2 Columnas</title>

   <script src="https://unonibes4a.github.io/pintaresta/a.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #14161a;
            color: #d1d5db;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
        }

        /* Layout de dos columnas */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Botón Hamburguesa */
        .hamburger-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 1000;
            background: #20242b;
            border: 1px solid #3c424d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger-btn:hover {
            background: #2b313a;
            border-color: #2196F3;
        }

        /* Columna 1: Menú Lateral (300px) */
        .sidebar {
            width: 300px;
            min-width: 300px;
            height: 100%;
            background: #181a1f;
            border-right: 1px solid #282b33;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 60px 12px 20px 12px; /* espacio arriba para el botón */
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Clase para colapsar la barra lateral */
        .sidebar.collapsed {
            margin-left: -300px;
        }

        /* Columna 2: Canvas Centrado */
        .main-workspace {
            flex: 1;
            height: 100%;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #0e1013;
            position: relative;
        }

        .workspace-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            max-width: 95%;
            max-height: 95%;
        }

        .drop-area {
            border: 2px dashed #3c424d;
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            font-size: 13px;
            color: #8c93a0;
            background-color: #15171b;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 600px;
            cursor: pointer;
            user-select: none;
        }

        .drop-area:hover, .drop-area.highlight {
            background-color: #20242b;
            border-color: #2196F3;
            color: #fff;
        }

        .canvas-container {
            max-width: 100%;
            max-height: 75vh;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 6px;
            border: 1px solid #282b33;
            background: #08090a;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            height: auto;
            object-fit: contain;
        }

        /* Estilo de Scrollbar fina para el menú */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #2b313a;
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Botón Hamburguesa -->
        <button id="btnToggleSidebar" class="hamburger-btn" title="Mostrar/Ocultar Menú">☰</button>

        <!-- Columna 1: Menú Lateral de Herramientas -->
        <aside class="sidebar" id="sidebar">
            <!-- Los paneles UISmartPanel se montan aquí dinámicamente -->
        </aside>

        <!-- Columna 2: Espacio de Trabajo con Canvas Centrado -->
        <main class="main-workspace">
            <div class="workspace-content">
                <div class="drop-area" id="dropArea">
                    📁 Clic para abrir, arrastra o pega (<b>Ctrl + V</b>)
                </div>
                <div class="canvas-container">
                    <canvas id="myCanvas" width="500" height="500"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.6.0/+esm';

        // 1. Configuración de tema UI
        if (window.UI && window.UI.Theme) {
            UI.Theme.inject();
            UI.Theme.set({
                'panel-width': '100%',
                'font-size-panel-title': '12px',
                'font-size-label': '11px',
                'font-size-btn': '11px'
            });
        }

        // =======================================================
        // 2. TOGGLE MENÚ HAMBURGUESA
        // =======================================================
        const sidebar = document.getElementById('sidebar');
        const btnToggleSidebar = document.getElementById('btnToggleSidebar');

        btnToggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // =======================================================
        // 3. CREACIÓN DE PANELES (SIDEBAR)
        // =======================================================

        // --- PANEL 1: Dimensiones ---
        const panelDims = new UISmartPanel({ title: 'Dimensiones & Aspecto', floating: false });
        const inWidth = new UIInputNumberInt({ value: 500, min: 1, max: 8192 });
        const inHeight = new UIInputNumberInt({ value: 300, min: 1, max: 8192 });
        const chkAspect = new UICheckbox({ label: 'Mantener Aspecto', checked: true });
        const btnResize = new UIButton({ text: 'Redimensionar', variant: 'primary' });

        panelDims.addRow(new UILabel({ text: 'Ancho' }), inWidth);
        panelDims.addRow(new UILabel({ text: 'Alto' }), inHeight);
        panelDims.addRow(chkAspect);
        panelDims.addRow(btnResize);

        // --- PANEL 2: Acciones ---
        const panelActions = new UISmartPanel({ title: 'Acciones de Imagen', floating: false });
        const btnEnhance = new UIButton({ text: 'Mejorar Calidad' });
        const btnRemoveBg = new UIButton({ text: 'Remover Fondo' });
        const btnFillBlack = new UIButton({ text: 'Rellenar Negro' });
        const btnCenter = new UIButton({ text: 'Centrar Imagen' });
        const btnCopy = new UIButton({ text: 'Copiar' });
        const btnPaste = new UIButton({ text: 'Pegar' });
        const btnPaintHunyuan = new UIButton({ text: 'Paint Hunyuan3D' });
        const btn3dMesh = new UIButton({ text: 'ImgTo3dMesh Creator' });
        const btnMeshPaint = new UIButton({ text: 'Paint3D / Mesh3D' });
        const btnNoFunciona = new UIButton({ text: 'No Funciona (Alt)' });
        const infoStatus = new UIInfo({ text: 'Listo para procesar' });

        panelActions.addRow(btnEnhance, btnRemoveBg);
        panelActions.addRow(btnFillBlack, btnCenter);
        panelActions.addRow(btnCopy, btnPaste);
        panelActions.addRow(btnPaintHunyuan);
        panelActions.addRow(btn3dMesh);
        panelActions.addRow(btnMeshPaint);
        panelActions.addRow(btnNoFunciona);
        panelActions.addRow(infoStatus);

        // --- PANEL 3: Filtros Básicos ---
        const panelFilters = new UISmartPanel({ title: 'Filtros Básicos', floating: false });
        const slSaturation = new UIConfigurableSlider({ label: 'Sat', min: 0, max: 200, step: 1, value: 100 });
        const slBrightness = new UIConfigurableSlider({ label: 'Bri', min: 0, max: 200, step: 1, value: 100 });
        const slHue = new UIConfigurableSlider({ label: 'Hue', min: 0, max: 360, step: 1, value: 0 });
        const slContrast = new UIConfigurableSlider({ label: 'Con', min: 0, max: 200, step: 1, value: 100 });
        const slBlur = new UIConfigurableSlider({ label: 'Blu', min: 0, max: 20, step: 1, value: 0 });

        panelFilters.addRow(slSaturation);
        panelFilters.addRow(slBrightness);
        panelFilters.addRow(slHue);
        panelFilters.addRow(slContrast);
        panelFilters.addRow(slBlur);

        // --- PANEL 4: Normal Map ---
        const panelNormalMap = new UISmartPanel({ title: 'Generador Normal Map', floating: false });
        const slBias = new UIConfigurableSlider({ label: 'Bias', min: 1, max: 100, step: 1, value: 100 });
        const slStrength = new UIConfigurableSlider({ label: 'Fuerza', min: 0, max: 100, step: 1, value: 50 });
        const chkInvert = new UICheckbox({ label: 'Invertir', checked: false });
        const chkRed = new UICheckbox({ label: 'R', checked: true });
        const chkGreen = new UICheckbox({ label: 'G', checked: true });
        const btnCreateNormal = new UIButton({ text: 'Crear Normal Map', variant: 'primary' });

        panelNormalMap.addRow(slBias);
        panelNormalMap.addRow(slStrength);
        panelNormalMap.addRow(chkInvert, chkRed, chkGreen);
        panelNormalMap.addRow(btnCreateNormal);

        // --- PANEL 5: Exportar & Control ---
        const panelExport = new UISmartPanel({ title: 'Finalizar & Descargar', floating: false });
        const btnApplyFilters = new UIButton({ text: 'Aplicar Filtros' });
        const btnResetFilters = new UIButton({ text: 'Resetear Filtros', variant: 'danger' });
        const btnDownload = new UIButton({ text: 'Descargar Imagen', variant: 'primary' });

        panelExport.addRow(btnApplyFilters, btnResetFilters);
        panelExport.addRow(btnDownload);

        // Montar los paneles directamente dentro del Sidebar de 300px
        const panels = [panelDims, panelActions, panelFilters, panelNormalMap, panelExport];
        panels.forEach(panel => {
            if (panel.mount) {
                panel.mount(sidebar);
            } else if (panel.element) {
                sidebar.appendChild(panel.element);
            }
        });

        // =======================================================
        // 4. LÓGICA DE PROCESAMIENTO CANVAS Y FILTROS
        // =======================================================
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const dropArea = document.getElementById('dropArea');

        let originalImage = null;
        let originalImageData = null;
        let currentFile = null;
        let originalAspectRatio = 1;

        let currentSaturation = 100;
        let currentBrightness = 100;
        let currentHue = 0;
        let currentContrast = 100;
        let currentBlur = 0;

        const hiddenFileInput = document.createElement('input');
        hiddenFileInput.type = 'file';
        hiddenFileInput.accept = 'image/*';
        hiddenFileInput.style.display = 'none';
        document.body.appendChild(hiddenFileInput);

        dropArea.addEventListener('click', () => hiddenFileInput.click());
        hiddenFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                currentFile = e.target.files[0];
                const reader = new FileReader();
                reader.onload = ev => loadImage(ev.target.result);
                reader.readAsDataURL(currentFile);
            }
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
            dropArea.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        ['dragenter', 'dragover'].forEach(ev => dropArea.addEventListener(ev, () => dropArea.classList.add('highlight'), false));
        ['dragleave', 'drop'].forEach(ev => dropArea.addEventListener(ev, () => dropArea.classList.remove('highlight'), false));

        dropArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                currentFile = files[0];
                const reader = new FileReader();
                reader.onload = ev => loadImage(ev.target.result);
                reader.readAsDataURL(currentFile);
            }
        });

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.startsWith('image/')) {
                    const blob = items[i].getAsFile();
                    currentFile = blob;
                    const reader = new FileReader();
                    reader.onload = ev => loadImage(ev.target.result);
                    reader.readAsDataURL(blob);
                    return;
                }
            }
        });

        function loadImage(src) {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                originalAspectRatio = img.width / img.height;

                canvas.width = img.width;
                canvas.height = img.height;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);

                originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                inWidth.setValue(img.width);
                inHeight.setValue(img.height);

                resetFilters();
                infoStatus.setText(`Cargado: ${img.width}x${img.height}px`);
            };
            img.src = src;
        }

        inWidth.element.addEventListener('input', () => {
            if (chkAspect.getValue() && originalImage) {
                const w = inWidth.getValue();
                if (w > 0) inHeight.setValue(Math.round(w / originalAspectRatio));
            }
        });

        inHeight.element.addEventListener('input', () => {
            if (chkAspect.getValue() && originalImage) {
                const h = inHeight.getValue();
                if (h > 0) inWidth.setValue(Math.round(h * originalAspectRatio));
            }
        });

        btnResize.element.addEventListener('click', () => {
            if (!originalImage) return alert('Primero carga una imagen.');
            let w = inWidth.getValue();
            let h = inHeight.getValue();

            if (chkAspect.getValue()) {
                h = Math.round(w / originalAspectRatio);
                inHeight.setValue(h);
            }

            canvas.width = w;
            canvas.height = h;
            applyFiltersToCanvas();
        });

        btnEnhance.element.addEventListener('click', () => {
            if (!originalImage) return alert('Primero carga una imagen.');
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width * 2;
            tempCanvas.height = canvas.height * 2;

            tempCtx.imageSmoothingEnabled = true;
            tempCtx.imageSmoothingQuality = 'high';
            tempCtx.filter = 'contrast(110%) brightness(105%) saturate(110%)';
            tempCtx.drawImage(originalImage, 0, 0, tempCanvas.width, tempCanvas.height);

            canvas.width = tempCanvas.width;
            canvas.height = tempCanvas.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(tempCanvas, 0, 0);

            inWidth.setValue(canvas.width);
            inHeight.setValue(canvas.height);
        });

        btnRemoveBg.element.addEventListener('click', async () => {
            if (!originalImage && !currentFile) return alert('Primero carga una imagen.');
            infoStatus.setText('Removiendo fondo...');

            try {
                let input = currentFile;
                if (!input) {
                    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                    input = blob;
                }
                const blobResult = await removeBackground(input, {
                    progress: (k, curr, tot) => {
                        infoStatus.setText(`${Math.round((curr / tot) * 100)}% descargando red`);
                    }
                });
                loadImage(URL.createObjectURL(blobResult));
                infoStatus.setText('Fondo removido con éxito');
            } catch (err) {
                alert('Error al remover fondo: ' + err.message);
                infoStatus.setText('Error al procesar');
            }
        });

        btnFillBlack.element.addEventListener('click', () => {
            if (!originalImage) return alert('Primero carga una imagen.');
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;

            tempCtx.fillStyle = '#000000';
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tempCtx.drawImage(canvas, 0, 0);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(tempCanvas, 0, 0);
        });

        btnCenter.element.addEventListener('click', () => {
            if (!originalImage) return alert('Primero carga una imagen.');
            const res = parseInt(prompt('Resolución cuadrada:', '2048')) || 2048;
            const margin = parseInt(prompt('Margen px:', '45')) || 45;

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = res;
            tempCanvas.height = res;

            tempCtx.fillStyle = confirm('¿Fondo blanco? (Cancelar = Negro)') ? '#ffffff' : '#000000';
            tempCtx.fillRect(0, 0, res, res);

            const maxDim = res - (margin * 2);
            let sW = (canvas.width > canvas.height) ? maxDim : (canvas.width * maxDim) / canvas.height;
            let sH = (canvas.width > canvas.height) ? (canvas.height * maxDim) / canvas.width : maxDim;

            const x = (res - sW) / 2;
            const y = (res - sH) / 2;
            tempCtx.drawImage(canvas, x, y, sW, sH);

            canvas.width = res;
            canvas.height = res;
            ctx.clearRect(0, 0, res, res);
            ctx.drawImage(tempCanvas, 0, 0);

            inWidth.setValue(res);
            inHeight.setValue(res);
        });

        btnCopy.element.addEventListener('click', () => {
            if (!originalImage) return;
            canvas.toBlob(async blob => {
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                infoStatus.setText('Imagen copiada');
            });
        });

        btnPaste.element.addEventListener('click', async () => {
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    for (const type of item.types) {
                        if (type.startsWith('image/')) {
                            const blob = await item.getType(type);
                            currentFile = blob;
                            loadImage(URL.createObjectURL(blob));
                            return;
                        }
                    }
                }
            } catch (e) {
                alert('No se pudo pegar: ' + e.message);
            }
        });

        slSaturation.onChange = (v) => { currentSaturation = v; applyFiltersToCanvas(); };
        slBrightness.onChange = (v) => { currentBrightness = v; applyFiltersToCanvas(); };
        slHue.onChange = (v) => { currentHue = v; applyFiltersToCanvas(); };
        slContrast.onChange = (v) => { currentContrast = v; applyFiltersToCanvas(); };
        slBlur.onChange = (v) => { currentBlur = v; applyFiltersToCanvas(); };

        btnApplyFilters.element.addEventListener('click', applyFiltersToCanvas);
        btnResetFilters.element.addEventListener('click', resetFilters);

        function applyFiltersToCanvas() {
            if (!originalImage) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.filter = `saturate(${currentSaturation}%) brightness(${currentBrightness}%) hue-rotate(${currentHue}deg) contrast(${currentContrast}%) blur(${currentBlur}px)`;
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';
        }

        function resetFilters() {
            currentSaturation = 100;
            currentBrightness = 100;
            currentHue = 0;
            currentContrast = 100;
            currentBlur = 0;

            slSaturation.setValue(100);
            slBrightness.setValue(100);
            slHue.setValue(0);
            slContrast.setValue(100);
            slBlur.setValue(0);
            slBias.setValue(10);
            slStrength.setValue(50);

            if (originalImageData) ctx.putImageData(originalImageData, 0, 0);
            else applyFiltersToCanvas();
        }

        btnPaintHunyuan.element.addEventListener('click', () => {
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.putImageData(colorinihunyuan(imgData), 0, 0);
        });

        btn3dMesh.element.addEventListener('click', () => {
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.putImageData(colorpasocolor3dmesh(imgData), 0, 0);
        });

        btnMeshPaint.element.addEventListener('click', () => {
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.putImageData(meshpaintcolor27112025731(imgData), 0, 0);
        });

        btnNoFunciona.element.addEventListener('click', () => {
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.putImageData(meshpasonofunciona(imgData), 0, 0);
        });

        btnCreateNormal.element.addEventListener('click', () => {
            if (!originalImageData) return alert('Primero carga una imagen.');
            ctx.putImageData(originalImageData, 0, 0);
            createNormalMap();
        });

        btnDownload.element.addEventListener('click', () => {
            if (!originalImage) return;
            const a = document.createElement('a');
            a.download = 'imagen_editada.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        });

        function createNormalMap() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const newData = new Uint8ClampedArray(data.length);

            const bias = parseFloat(slBias.getValue()) / 100.0;
            const strength = parseFloat(slStrength.getValue()) / 10.0;
            const invertR = chkInvert.getValue() ? -1.0 : 1.0;
            const invertG = chkInvert.getValue() ? -1.0 : 1.0;
            const useRed = chkRed.getValue();
            const useGreen = chkGreen.getValue();

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;

                    const d1 = getRed(data, x + 1, y, canvas.width, canvas.height) / 255.0;
                    const d2 = getRed(data, x - 1, y, canvas.width, canvas.height) / 255.0;
                    const d3 = getRed(data, x, y + 1, canvas.width, canvas.height) / 255.0;
                    const d4 = getRed(data, x, y - 1, canvas.width, canvas.height) / 255.0;

                    let dx = (d2 - d1) * strength * invertR;
                    let dy = (d4 - d3) * strength * invertG;
                    const dz = 1.0 / Math.max(bias, 0.01);

                    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    const nx = dx / len;
                    const ny = dy / len;
                    const nz = dz / len;

                    newData[index] = useRed ? Math.floor(Math.max(0, Math.min(255, (nx * 0.5 + 0.5) * 255))) : data[index];
                    newData[index + 1] = useGreen ? Math.floor(Math.max(0, Math.min(255, (ny * 0.5 + 0.5) * 255))) : data[index + 1];
                    newData[index + 2] = Math.floor(Math.max(0, Math.min(255, (nz * 0.5 + 0.5) * 255)));
                    newData[index + 3] = 255;
                }
            }
            ctx.putImageData(new ImageData(newData, canvas.width, canvas.height), 0, 0);
        }

        function getRed(data, x, y, width, height) {
            if (x < 0 || x >= width || y < 0 || y >= height) return 0;
            return data[(y * width + x) * 4];
        }

        const saturationGio = (tex_color, ec5) => {
            const valLim = x => Math.max(0.0, Math.min(1.0, x));
            const maxx = Math.max(tex_color.r, tex_color.g, tex_color.b);
            if (tex_color.r !== maxx) tex_color.r += (maxx - tex_color.r) * ec5;
            if (tex_color.g !== maxx) tex_color.g += (maxx - tex_color.g) * ec5;
            if (tex_color.b !== maxx) tex_color.b += (maxx - tex_color.b) * ec5;
            tex_color.r = valLim(tex_color.r);
            tex_color.g = valLim(tex_color.g);
            tex_color.b = valLim(tex_color.b);
            return tex_color;
        };

        const mixerHtmlPasaColor = (rgbax, rgba2 = { r: 0.5, g: 0.45, b: 0.36 }, porcent, bool = true) => {
            let maxx0 = Math.max(rgbax.r, rgbax.g, rgbax.b);
            let clmd = 1.0 - porcent;
            rgbax.r = rgbax.r * clmd + rgba2.r * porcent;
            rgbax.g = rgbax.g * clmd + rgba2.g * porcent;
            rgbax.b = rgbax.b * clmd + rgba2.b * porcent;
            if (bool) {
                let max2 = Math.max(rgbax.r, rgbax.g, rgbax.b);
                operacionMatematica(rgbax, maxx0 / (max2 + 0.00001), "*");
            }
            return rgbax;
        };

        const colorDivide = c => (Math.min(c.r, c.g, c.b)) / (Math.max(c.r, c.g, c.b) + 0.000001);
        const simpleLinealFuncion = (x1, y1, x2, y2, val) => {
            let dx = (x2 - x1) + 0.00001;
            let m = (y2 - y1) / dx;
            return m * val + (y2 - m * x2);
        };
        const limit = (num, min = 0.0, max = 1.0) => Math.max(min, Math.min(max, num));

        const operacionMatematica = (rgba, val, operacion) => {
            const v = x => Math.max(0, Math.min(1, x));
            if (operacion == "*") { rgba.r = v(rgba.r * val); rgba.g = v(rgba.g * val); rgba.b = v(rgba.b * val); }
            if (operacion == "+") { rgba.r = v(rgba.r + val); rgba.g = v(rgba.g + val); rgba.b = v(rgba.b + val); }
            return rgba;
        };

        const colorinihunyuan = (imageData) => {
            let data = imageData.data;
            let rgba = { r: 0, g: 0, b: 0 }, rgba2 = { r: 0, g: 0, b: 0 };
            let count = 0;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
                let m = Math.max(r, g, b);
                if (m > 0.3 && m < 0.7) { rgba2.r += r; rgba2.g += g; rgba2.b += b; count++; }
            }
            if (count > 0) { rgba2.r /= count; rgba2.g /= count; rgba2.b /= count; }
            for (let i = 0; i < data.length; i += 4) {
                rgba.r = data[i] / 255; rgba.g = data[i + 1] / 255; rgba.b = data[i + 2] / 255;
                let maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                operacionMatematica(rgba, (1 - limit(maxpx * 2)) * 0.1, "+");
                operacionMatematica(rgba, simpleLinealFuncion(1, 0.5, 0, 1.2, maxpx), "*");
                let dv = colorDivide(rgba);
                rgba = mixerHtmlPasaColor(rgba, rgba2, limit(simpleLinealFuncion(1, 1, 0.4, 0, dv)), true);
                data[i] = rgba.r * 255; data[i + 1] = rgba.g * 255; data[i + 2] = rgba.b * 255;
            }
            return imageData;
        };

        const meshpasonofunciona = (imageData) => {
            let data = imageData.data;
            let rgba = { r: 0, g: 0, b: 0 };
            let paso2 = confirm("mesh creator cancelar paint");
            let sum = parseFloat(prompt("suma", "0.1")) || 0.1;
            for (let i = 0; i < data.length; i += 4) {
                rgba.r = data[i] / 255; rgba.g = data[i + 1] / 255; rgba.b = data[i + 2] / 255;
                let maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                if (!paso2) {
                    operacionMatematica(rgba, simpleLinealFuncion(1, -0.3, 0, sum, maxpx), "+");
                    for (let i2 = 0; i2 < 2; i2++) saturationGio(rgba, 0.5 - colorDivide(rgba));
                } else {
                    operacionMatematica(rgba, simpleLinealFuncion(1, 0.67, 0, 1.5, limit(maxpx * 2, 0, 1)), "*");
                    operacionMatematica(rgba, (1 - maxpx) * (0.1 + sum) * maxpx, "+");
                    for (let i2 = 0; i2 < 2; i2++) saturationGio(rgba, 0.5 - colorDivide(rgba));
                }
                data[i] = rgba.r * 255; data[i + 1] = rgba.g * 255; data[i + 2] = rgba.b * 255;
            }
            return imageData;
        };

        const meshpaintcolor27112025731 = (imageData) => {
            let data = imageData.data;
            let rgba = { r: 0, g: 0, b: 0 };
            let vuelta = confirm("¿No es para blender?");
            for (let i = 0; i < data.length; i += 4) {
                rgba.r = data[i] / 255; rgba.g = data[i + 1] / 255; rgba.b = data[i + 2] / 255;
                let maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                if (vuelta) {
                    operacionMatematica(rgba, simpleLinealFuncion(1, 0, 0, 0.2, maxpx), "+");
                    saturationGio(rgba, 0.5 - colorDivide(rgba));
                    maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                    if (maxpx > 0.67) operacionMatematica(rgba, 0.67 / (maxpx + 0.000001), "*");
                    saturationGio(rgba, -colorDivide(rgba) * 0.3);
                } else {
                    operacionMatematica(rgba, (1 - maxpx) * 0.2 * maxpx, "+");
                    maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                    operacionMatematica(rgba, (1 - maxpx) * 0.2 * maxpx, "+");
                    maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                    operacionMatematica(rgba, (maxpx) * 0.2 * -maxpx, "+");
                }
                data[i] = rgba.r * 255; data[i + 1] = rgba.g * 255; data[i + 2] = rgba.b * 255;
            }
            return imageData;
        };

        const colorpasocolor3dmesh = (imageData) => {
            let data = imageData.data;
            let rgba = { r: 0, g: 0, b: 0 };
            let mul = confirm("¿Multiplicar (sum)?");
            for (let i = 0; i < data.length; i += 4) {
                rgba.r = data[i] / 255; rgba.g = data[i + 1] / 255; rgba.b = data[i + 2] / 255;
                let maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                if (mul) {
                    operacionMatematica(rgba, simpleLinealFuncion(1, 0.7, 0, 0.09, maxpx) / (maxpx + 0.000001), "*");
                } else {
                    operacionMatematica(rgba, 0.05, "+");
                    maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                    if (maxpx > 0.5) operacionMatematica(rgba, 0.5 / (maxpx + 0.00001), "*");
                    saturationGio(rgba, 0.3 - colorDivide(rgba));
                    saturationGio(rgba, 0.3 - colorDivide(rgba));
                }
                data[i] = rgba.r * 255; data[i + 1] = rgba.g * 255; data[i + 2] = rgba.b * 255;
            }
            return imageData;
        };
    </script>
