<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor de Imágenes Avanzado - 2 Columnas</title>

    <script src="https://unonibes4a.github.io/pintaresta/a.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #14161a;
            color: #d1d5db;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .hamburger-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 1000;
            background: #20242b;
            border: 1px solid #3c424d;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger-btn:hover {
            background: #2b313a;
            border-color: #2196F3;
        }

        .sidebar {
            width: 300px;
            min-width: 300px;
            height: 100%;
            background: #49494957;
            border-right: 1px solid #3d3d3dbd;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 60px 12px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.collapsed { margin-left: -300px; }

        .main-workspace {
            flex: 1;
            height: 100%;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #000000b4;
            position: relative;
        }

        .workspace-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            max-width: 95%;
            max-height: 95%;
        }

        .drop-area {
            border: 2px dashed #555557;
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            font-size: 13px;
            color: #8c93a0;
            background-color: #2020208a;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 600px;
            cursor: pointer;
            user-select: none;
        }

        .drop-area:hover, .drop-area.highlight {
            background-color: #424242bb;
            border-color: #2195f3ab;
            color: #fff;
        }

        .canvas-container {
            max-width: 100%;
            max-height: 75vh;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
     
            border-radius: 6px;
            border: 1px solid #30303079;
            background: #3a3a3a42;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            height: auto;
            object-fit: contain;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: #2b313a; border-radius: 3px; }
    </style>
</head>

<body>

    <div class="app-container">
        <button id="btnToggleSidebar" class="hamburger-btn" title="Mostrar/Ocultar Menú">☰</button>

        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-workspace">
            <div class="workspace-content">
                <div class="drop-area" id="dropArea" onclick="document.getElementById('hiddenFileInput').click()">
                    Clic para abrir, arrastra o pega 
                </div>
                <input type="file" id="hiddenFileInput" accept="image/*" style="display:none">
                <div class="canvas-container">
                    <canvas id="myCanvas" width="1024" height="1024"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script>
        class CanvasCurves {
            constructor(canvas, opts = {}) {
                if (!canvas || canvas.tagName !== 'CANVAS') throw new Error('CanvasCurves: <canvas> requerido');
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d', { willReadFrequently: true });

                this.onPreview   = opts.onPreview   || null;
                this.onApply     = opts.onApply     || null;
                this.onReset     = opts.onReset     || null;
                this.onGrayscale = opts.onGrayscale || null;

                this.includeAlpha = !!opts.includeAlpha;

                this.colors = Object.assign({
                    rgb: '#e6e6e6',
                    r:   '#ff5555',
                    g:   '#55ff55',
                    b:   '#5599ff',
                    a:   '#ffcc55'
                }, opts.colors || {});

                this._initCurves();
                this.active = 'rgb';
                this.grayscale = false;
                this.snapshot = null;

                this._ui = null;
                this._ec = null;
                this._ecx = null;
                this._dragIdx = -1;
                this._hoverIdx = -1;
                this._infoEl = null;

                this._cw = 260;
                this._ch = 252;
                this._padL = 24;
                this._padT = 6;
                this._padB = 16;
                this._padR = 6;
                this._pw = this._cw - this._padL - this._padR;
                this._ph = this._ch - this._padT - this._padB;

                this._boundMove = this._onMouseMove.bind(this);
                this._boundUp   = this._onMouseUp.bind(this);
            }

            begin() {
                this.snapshot = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                return this;
            }

            reset() {
                this._initCurves();
                this.grayscale = false;
                this._render();
                this._drawEditor();
                this._updateInfo(null, null, null);
                if (this.onReset) this.onReset();
                return this;
            }

            setGrayscale(v) {
                this.grayscale = !!v;
                this._render();
                this._drawEditor();
                if (this.onGrayscale) this.onGrayscale(this.grayscale);
                return this;
            }

            toggleGrayscale() { return this.setGrayscale(!this.grayscale); }

            setChannel(ch) {
                if (!this.curves[ch]) return this;
                this.active = ch;
                this._drawEditor();
                return this;
            }

            addPoint(x, y, ch) {
                ch = ch || this.active;
                const pts = this.curves[ch];
                x = Math.max(0, Math.min(255, Math.round(x)));
                y = Math.max(0, Math.min(255, Math.round(y)));
                for (const p of pts) if (Math.abs(p.x - x) < 4) return this;
                pts.push({ x, y });
                pts.sort((a, b) => a.x - b.x);
                this._render();
                this._drawEditor();
                return this;
            }

            movePoint(idx, x, y, ch) {
                ch = ch || this.active;
                const pts = this.curves[ch];
                if (idx < 0 || idx >= pts.length) return this;

                if (idx === 0) {
                    pts[0].x = 0;
                    pts[0].y = Math.max(0, Math.min(255, Math.round(y)));
                } else if (idx === pts.length - 1) {
                    pts[idx].x = 255;
                    pts[idx].y = Math.max(0, Math.min(255, Math.round(y)));
                } else {
                    const minX = pts[idx - 1].x + 2;
                    const maxX = pts[idx + 1].x - 2;
                    pts[idx].x = Math.max(minX, Math.min(maxX, Math.round(x)));
                    pts[idx].y = Math.max(0, Math.min(255, Math.round(y)));
                }
                this._render();
                this._drawEditor();
                return this;
            }

            removePoint(idx, ch) {
                ch = ch || this.active;
                const pts = this.curves[ch];
                if (pts.length <= 2 || idx <= 0 || idx >= pts.length - 1) return this;
                pts.splice(idx, 1);
                this._render();
                this._drawEditor();
                this._updateInfo(null, null, null);
                return this;
            }

            apply() {
                this.snapshot = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                this._initCurves();
                this.grayscale = false;
                this._drawEditor();
                this._updateInfo(null, null, null);
                if (this.onApply) this.onApply(this.snapshot);
                return this.snapshot;
            }

            static toGrayscale(canvas, weights) {
                weights = weights || { r: 0.299, g: 0.587, b: 0.114 };
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const g = (weights.r * d[i] + weights.g * d[i + 1] + weights.b * d[i + 2]) | 0;
                    d[i] = d[i + 1] = d[i + 2] = g;
                }
                ctx.putImageData(img, 0, 0);
                return img;
            }

            _initCurves() {
                this.curves = {
                    rgb: this._identityCurve(),
                    r:   this._identityCurve(),
                    g:   this._identityCurve(),
                    b:   this._identityCurve()
                };
                if (this.includeAlpha) this.curves.a = this._identityCurve();
            }

            _identityCurve() { return [{ x: 0, y: 0 }, { x: 255, y: 255 }]; }

            _buildLUT(points) {
                const lut = new Uint8Array(256);
                const n = points.length;

                if (n === 0) { for (let i = 0; i < 256; i++) lut[i] = i; return lut; }
                if (n === 1) { for (let i = 0; i < 256; i++) lut[i] = points[0].y; return lut; }
                if (n === 2 && points[0].x === 0 && points[0].y === 0 &&
                              points[1].x === 255 && points[1].y === 255) {
                    for (let i = 0; i < 256; i++) lut[i] = i;
                    return lut;
                }

                const xs = new Float64Array(n);
                const ys = new Float64Array(n);
                for (let i = 0; i < n; i++) { xs[i] = points[i].x; ys[i] = points[i].y; }

                const dx = new Float64Array(n - 1);
                const ms = new Float64Array(n - 1);
                for (let i = 0; i < n - 1; i++) {
                    dx[i] = xs[i + 1] - xs[i];
                    ms[i] = dx[i] === 0 ? 0 : (ys[i + 1] - ys[i]) / dx[i];
                }

                const c1 = new Float64Array(n);
                c1[0] = ms[0];
                c1[n - 1] = ms[n - 2];
                for (let i = 1; i < n - 1; i++) {
                    if (ms[i - 1] * ms[i] <= 0) {
                        c1[i] = 0;
                    } else {
                        const w1 = 2 * dx[i] + dx[i - 1];
                        const w2 = dx[i] + 2 * dx[i - 1];
                        c1[i] = (w1 + w2) / (w1 / ms[i - 1] + w2 / ms[i]);
                    }
                }

                let seg = 0;
                for (let x = 0; x < 256; x++) {
                    if (x <= xs[0])     { lut[x] = ys[0] | 0; continue; }
                    if (x >= xs[n - 1]) { lut[x] = ys[n - 1] | 0; continue; }
                    while (seg < n - 2 && x > xs[seg + 1]) seg++;

                    const t  = (x - xs[seg]) / dx[seg];
                    const t2 = t * t;
                    const t3 = t2 * t;
                    const h00 =  2 * t3 - 3 * t2 + 1;
                    const h10 =      t3 - 2 * t2 + t;
                    const h01 = -2 * t3 + 3 * t2;
                    const h11 =      t3 -     t2;
                    const y = h00 * ys[seg] + h10 * dx[seg] * c1[seg]
                            + h01 * ys[seg + 1] + h11 * dx[seg] * c1[seg + 1];
                    lut[x] = y < 0 ? 0 : y > 255 ? 255 : (y + 0.5) | 0;
                }
                return lut;
            }

            _render() {
                if (!this.snapshot) this.begin();
                const w = this.canvas.width;
                const h = this.canvas.height;
                const src = this.snapshot.data;
                const out = new Uint8ClampedArray(src.length);

                const lutM = this._buildLUT(this.curves.rgb);
                const lutR = this._buildLUT(this.curves.r);
                const lutG = this._buildLUT(this.curves.g);
                const lutB = this._buildLUT(this.curves.b);
                const lutA = this.includeAlpha ? this._buildLUT(this.curves.a) : null;

                const gray = this.grayscale;

                for (let i = 0; i < src.length; i += 4) {
                    let r = src[i], g = src[i + 1], b = src[i + 2], a = src[i + 3];
                    if (gray) {
                        const y = (0.299 * r + 0.587 * g + 0.114 * b) | 0;
                        r = g = b = y;
                    }
                    out[i]     = lutR[lutM[r]];
                    out[i + 1] = lutG[lutM[g]];
                    out[i + 2] = lutB[lutM[b]];
                    out[i + 3] = lutA ? lutA[a] : a;
                }

                const imgData = new ImageData(out, w, h);
                this.ctx.putImageData(imgData, 0, 0);
                if (this.onPreview) this.onPreview(imgData);
            }

            mountUI(container) {
                if (this._ui) return this._ui;

                const root = document.createElement('div');
                root.style.cssText =
                    'background:#1c1f26;border:1px solid #2c313c;border-radius:8px;' +
                    'padding:12px;width:280px;color:#d1d5db;box-sizing:border-box;' +
                    'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:12px;';

                const header = document.createElement('div');
                header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;';

                const title = document.createElement('div');
                title.textContent = 'Curvas';
                title.style.cssText = 'font-weight:600;font-size:13px;color:#fff;';

                const info = document.createElement('div');
                info.textContent = 'X: —   Y: —';
                info.style.cssText =
                    'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;' +
                    'font-size:11px;color:#9aa3b2;background:#101318;padding:3px 7px;' +
                    'border-radius:4px;border:1px solid #2c313c;letter-spacing:0.3px;' +
                    'min-width:110px;text-align:center;';
                this._infoEl = info;

                header.appendChild(title);
                header.appendChild(info);
                root.appendChild(header);

                const chRow = document.createElement('div');
                chRow.style.cssText = 'display:flex;gap:4px;margin-bottom:10px;';
                const channels = this.includeAlpha ? ['rgb','r','g','b','a'] : ['rgb','r','g','b'];
                const chBtns = {};
                channels.forEach(ch => {
                    const btn = document.createElement('button');
                    btn.textContent = ch.toUpperCase();
                    btn.style.cssText =
                        'flex:1;padding:5px 0;border:1px solid #2c313c;border-radius:4px;' +
                        'background:#232830;color:#9aa3b2;font-size:10px;font-weight:600;' +
                        'cursor:pointer;letter-spacing:0.5px;';
                    btn.addEventListener('click', () => {
                        this.setChannel(ch);
                        updateChannelUI();
                        this._updateInfo(null, null, null);
                    });
                    chRow.appendChild(btn);
                    chBtns[ch] = btn;
                });
                root.appendChild(chRow);

                const updateChannelUI = () => {
                    channels.forEach(ch => {
                        const b = chBtns[ch];
                        const on = ch === this.active;
                        b.style.background  = on ? this.colors[ch] : '#232830';
                        b.style.color       = on ? '#111' : '#9aa3b2';
                        b.style.borderColor = on ? this.colors[ch] : '#2c313c';
                    });
                };
                updateChannelUI();

                const ec = document.createElement('canvas');
                ec.width = this._cw;
                ec.height = this._ch;
                ec.style.cssText =
                    'display:block;width:100%;height:auto;border-radius:6px;' +
                    'background:#101318;border:1px solid #2c313c;cursor:crosshair;' +
                    'touch-action:none;user-select:none;';
                root.appendChild(ec);
                this._ec = ec;
                this._ecx = ec.getContext('2d');

                ec.addEventListener('mousedown', this._onMouseDown.bind(this));
                ec.addEventListener('mousemove', this._onEditorHover.bind(this));
                ec.addEventListener('mouseleave', () => {
                    this._hoverIdx = -1;
                    this._drawEditor();
                    if (this._dragIdx < 0) this._updateInfo(null, null, null);
                });
                ec.addEventListener('contextmenu', e => e.preventDefault());

                const btnRow = document.createElement('div');
                btnRow.style.cssText = 'display:flex;gap:6px;margin-top:10px;';

                const btnGray = document.createElement('button');
                btnGray.textContent = 'Gris';
                btnGray.style.cssText = this._btnStyle();
                btnGray.addEventListener('click', () => { this.toggleGrayscale(); updateGrayUI(); });

                const updateGrayUI = () => {
                    const on = this.grayscale;
                    btnGray.style.background  = on ? '#3b82f6' : '#232830';
                    btnGray.style.color       = on ? '#fff' : '#d1d5db';
                    btnGray.style.borderColor = on ? '#3b82f6' : '#2c313c';
                };
                updateGrayUI();

                const btnReset = document.createElement('button');
                btnReset.textContent = 'Reset';
                btnReset.style.cssText = this._btnStyle();
                btnReset.addEventListener('click', () => { this.reset(); updateChannelUI(); updateGrayUI(); });

                const btnApply = document.createElement('button');
                btnApply.textContent = 'Aplicar';
                btnApply.style.cssText = this._btnStyle('#3b82f6', '#fff');
                btnApply.addEventListener('click', () => { this.apply(); updateChannelUI(); updateGrayUI(); });

                btnRow.appendChild(btnGray);
                btnRow.appendChild(btnReset);
                btnRow.appendChild(btnApply);
                root.appendChild(btnRow);

                const hint = document.createElement('div');
                hint.textContent = 'Click: añadir · Arrastrar: mover · Click derecho: borrar';
                hint.style.cssText = 'margin-top:8px;font-size:10px;color:#6b7280;text-align:center;';
                root.appendChild(hint);

                this._ui = root;
                if (container) container.appendChild(root);
                this._drawEditor();
                this._updateInfo(null, null, null);
                return root;
            }

            _btnStyle(bg, color) {
                return 'flex:1;padding:6px 0;border:1px solid #2c313c;border-radius:4px;' +
                       'background:' + (bg || '#232830') + ';color:' + (color || '#d1d5db') + ';' +
                       'font-size:11px;font-weight:600;cursor:pointer;';
            }

            _updateInfo(x, y, idx) {
                if (!this._infoEl) return;
                if (x === null || y === null || idx === null || idx === undefined) {
                    this._infoEl.textContent = 'X: —   Y: —';
                    return;
                }
                const nx = (x / 255).toFixed(3);
                const ny = (y / 255).toFixed(3);
                this._infoEl.textContent = `X: ${nx}   Y: ${ny}`;
            }

            _drawEditor() {
                if (!this._ec) return;
                const cx = this._ecx;
                const W = this._cw;
                const H = this._ch;
                const PL = this._padL;
                const PT = this._padT;
                const PB = this._padB;
                const PR = this._padR;
                const PW = this._pw;
                const PH = this._ph;

                cx.clearRect(0, 0, W, H);
                cx.fillStyle = '#101318';
                cx.fillRect(0, 0, W, H);

                cx.fillStyle = '#0a0d12';
                cx.fillRect(PL, PT, PW, PH);

                cx.strokeStyle = '#1e232c';
                cx.lineWidth = 1;
                for (let i = 1; i < 4; i++) {
                    const x = PL + (i / 4) * PW;
                    const y = PT + (i / 4) * PH;
                    cx.beginPath();
                    cx.moveTo(x + 0.5, PT); cx.lineTo(x + 0.5, PT + PH);
                    cx.moveTo(PL, y + 0.5); cx.lineTo(PL + PW, y + 0.5);
                    cx.stroke();
                }

                cx.strokeStyle = '#2c313c';
                cx.setLineDash([3, 3]);
                cx.beginPath();
                cx.moveTo(PL, PT + PH);
                cx.lineTo(PL + PW, PT);
                cx.stroke();
                cx.setLineDash([]);

                cx.strokeStyle = '#2c313c';
                cx.strokeRect(PL + 0.5, PT + 0.5, PW - 1, PH - 1);

                const toX = x => PL + (x / 255) * PW;
                const toY = y => PT + PH - (y / 255) * PH;

                const labels = ['0', '0.25', '0.5', '0.75', '1'];
                cx.font = '8px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
                cx.fillStyle = '#6b7280';

                cx.textAlign = 'center';
                cx.textBaseline = 'top';
                for (let i = 0; i < 5; i++) {
                    const x = PL + (i / 4) * PW;
                    cx.fillText(labels[i], x, PT + PH + 4);
                }

                cx.textAlign = 'right';
                cx.textBaseline = 'middle';
                for (let i = 0; i < 5; i++) {
                    const y = PT + PH - (i / 4) * PH;
                    cx.fillText(labels[i], PL - 4, y);
                }

                cx.strokeStyle = '#3a4150';
                cx.lineWidth = 1;
                for (let i = 0; i < 5; i++) {
                    const x = PL + (i / 4) * PW;
                    const y = PT + PH - (i / 4) * PH;
                    cx.beginPath();
                    cx.moveTo(x + 0.5, PT + PH - 2); cx.lineTo(x + 0.5, PT + PH);
                    cx.moveTo(PL, y + 0.5); cx.lineTo(PL + 2, y + 0.5);
                    cx.stroke();
                }

                const pts = this.curves[this.active];
                const lut = this._buildLUT(pts);

                ['r', 'g', 'b'].forEach(ch => {
                    if (ch === this.active) return;
                    const c = this.curves[ch];
                    if (c.length === 2 && c[0].y === 0 && c[1].y === 255) return;
                    const l = this._buildLUT(c);
                    cx.strokeStyle = this.colors[ch] + '55';
                    cx.lineWidth = 1;
                    cx.beginPath();
                    for (let x = 0; x < 256; x++) {
                        const sx = toX(x);
                        const sy = toY(l[x]);
                        if (x === 0) cx.moveTo(sx, sy);
                        else cx.lineTo(sx, sy);
                    }
                    cx.stroke();
                });

                cx.strokeStyle = this.colors[this.active];
                cx.lineWidth = 1.8;
                cx.beginPath();
                for (let x = 0; x < 256; x++) {
                    const sx = toX(x);
                    const sy = toY(lut[x]);
                    if (x === 0) cx.moveTo(sx, sy);
                    else cx.lineTo(sx, sy);
                }
                cx.stroke();

                if (this._dragIdx >= 0 && this._dragIdx < pts.length) {
                    const p = pts[this._dragIdx];
                    const sx = toX(p.x);
                    const sy = toY(p.y);
                    cx.strokeStyle = this.colors[this.active] + '88';
                    cx.setLineDash([3, 3]);
                    cx.lineWidth = 1;
                    cx.beginPath();
                    cx.moveTo(sx, PT + PH); cx.lineTo(sx, sy);
                    cx.moveTo(PL, sy);      cx.lineTo(sx, sy);
                    cx.stroke();
                    cx.setLineDash([]);
                }

                pts.forEach((p, i) => {
                    const sx = toX(p.x);
                    const sy = toY(p.y);
                    const r = i === this._dragIdx ? 6 : i === this._hoverIdx ? 5.5 : 4.5;
                    cx.beginPath();
                    cx.arc(sx, sy, r, 0, Math.PI * 2);
                    cx.fillStyle = this.colors[this.active];
                    cx.fill();
                    cx.strokeStyle = '#101318';
                    cx.lineWidth = 2;
                    cx.stroke();
                });
            }

            _onMouseDown(e) {
                e.preventDefault();

                if (e.button === 2) {
                    const idx = this._hitTest(e);
                    if (idx > 0) this.removePoint(idx);
                    return;
                }

                const idx = this._hitTest(e);
                if (idx >= 0) {
                    this._dragIdx = idx;
                    const p = this.curves[this.active][idx];
                    this._updateInfo(p.x, p.y, idx);
                } else {
                    const pos = this._eventPos(e);
                    const v = this._screenToValue(pos.x, pos.y);
                    const lut = this._buildLUT(this.curves[this.active]);
                    this.addPoint(v.x, lut[Math.round(v.x)]);
                    const after = this.curves[this.active];
                    for (let i = 0; i < after.length; i++) {
                        if (Math.abs(after[i].x - v.x) < 4) {
                            this._dragIdx = i;
                            this._updateInfo(after[i].x, after[i].y, i);
                            break;
                        }
                    }
                }

                window.addEventListener('mousemove', this._boundMove);
                window.addEventListener('mouseup', this._boundUp);
                this._drawEditor();
            }

            _onMouseMove(e) {
                if (this._dragIdx < 0) return;
                const pos = this._eventPos(e);
                const v = this._screenToValue(pos.x, pos.y);
                this.movePoint(this._dragIdx, v.x, v.y);
                const p = this.curves[this.active][this._dragIdx];
                if (p) this._updateInfo(p.x, p.y, this._dragIdx);
            }

            _onMouseUp() {
                this._dragIdx = -1;
                window.removeEventListener('mousemove', this._boundMove);
                window.removeEventListener('mouseup', this._boundUp);
                this._drawEditor();
            }

            _onEditorHover(e) {
                const idx = this._hitTest(e);
                if (idx !== this._hoverIdx) {
                    this._hoverIdx = idx;
                    this._drawEditor();
                    if (idx >= 0) {
                        const p = this.curves[this.active][idx];
                        this._updateInfo(p.x, p.y, idx);
                    } else if (this._dragIdx < 0) {
                        this._updateInfo(null, null, null);
                    }
                }
            }

            _hitTest(e) {
                const pos = this._eventPos(e);
                const pts = this.curves[this.active];
                const PL = this._padL;
                const PT = this._padT;
                const PW = this._pw;
                const PH = this._ph;
                const toX = x => PL + (x / 255) * PW;
                const toY = y => PT + PH - (y / 255) * PH;
                for (let i = 0; i < pts.length; i++) {
                    const dx = pos.x - toX(pts[i].x);
                    const dy = pos.y - toY(pts[i].y);
                    if (dx * dx + dy * dy < 100) return i;
                }
                return -1;
            }

            _eventPos(e) {
                const r = this._ec.getBoundingClientRect();
                const sx = this._cw / r.width;
                const sy = this._ch / r.height;
                return {
                    x: (e.clientX - r.left) * sx,
                    y: (e.clientY - r.top) * sy
                };
            }

            _screenToValue(sx, sy) {
                const x = ((sx - this._padL) / this._pw) * 255;
                const y = (1 - (sy - this._padT) / this._ph) * 255;
                return {
                    x: Math.max(0, Math.min(255, x)),
                    y: Math.max(0, Math.min(255, y))
                };
            }
        }

        function createNormalMap() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const newData = new Uint8ClampedArray(data.length);

            const bias = parseFloat(slBias.getValue()) / 100.0;
            const strength = parseFloat(slStrength.getValue()) / 10.0;
            const invertR = chkInvert.getValue() ? -1.0 : 1.0;
            const invertG = chkInvert.getValue() ? -1.0 : 1.0;
            const useRed = chkRed.getValue();
            const useGreen = chkGreen.getValue();

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const index = (y * canvas.width + x) * 4;

                    const d1 = getRed(data, x + 1, y, canvas.width, canvas.height) / 255.0;
                    const d2 = getRed(data, x - 1, y, canvas.width, canvas.height) / 255.0;
                    const d3 = getRed(data, x, y + 1, canvas.width, canvas.height) / 255.0;
                    const d4 = getRed(data, x, y - 1, canvas.width, canvas.height) / 255.0;

                    let dx = (d2 - d1) * strength * invertR;
                    let dy = (d4 - d3) * strength * invertG;
                    const dz = 1.0 / Math.max(bias, 0.01);

                    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
                    const nx = dx / len;
                    const ny = dy / len;
                    const nz = dz / len;

                    newData[index] = useRed ? Math.floor(Math.max(0, Math.min(255, (nx * 0.5 + 0.5) * 255))) : data[index];
                    newData[index + 1] = useGreen ? Math.floor(Math.max(0, Math.min(255, (ny * 0.5 + 0.5) * 255))) : data[index + 1];
                    newData[index + 2] = Math.floor(Math.max(0, Math.min(255, (nz * 0.5 + 0.5) * 255)));
                    newData[index + 3] = 255;
                }
            }
            ctx.putImageData(new ImageData(newData, canvas.width, canvas.height), 0, 0);
        }

        function getRed(data, x, y, width, height) {
            if (x < 0 || x >= width || y < 0 || y >= height) return 0;
            return data[(y * width + x) * 4];
        }

        const saturationGio = (tex_color, ec5) => {
            const valLim = x => Math.max(0.0, Math.min(1.0, x));
            const maxx = Math.max(tex_color.r, tex_color.g, tex_color.b);
            if (tex_color.r !== maxx) tex_color.r += (maxx - tex_color.r) * ec5;
            if (tex_color.g !== maxx) tex_color.g += (maxx - tex_color.g) * ec5;
            if (tex_color.b !== maxx) tex_color.b += (maxx - tex_color.b) * ec5;
            tex_color.r = valLim(tex_color.r);
            tex_color.g = valLim(tex_color.g);
            tex_color.b = valLim(tex_color.b);
            return tex_color;
        };

        const mixerHtmlPasaColor = (rgbax, rgba2 = { r: 0.5, g: 0.45, b: 0.36 }, porcent, bool = true) => {
            let maxx0 = Math.max(rgbax.r, rgbax.g, rgbax.b);
            let clmd = 1.0 - porcent;
            rgbax.r = rgbax.r * clmd + rgba2.r * porcent;
            rgbax.g = rgbax.g * clmd + rgba2.g * porcent;
            rgbax.b = rgbax.b * clmd + rgba2.b * porcent;
            if (bool) {
                let max2 = Math.max(rgbax.r, rgbax.g, rgbax.b);
                operacionMatematica(rgbax, maxx0 / (max2 + 0.00001), "*");
            }
            return rgbax;
        };

        const colorDivide = c => (Math.min(c.r, c.g, c.b)) / (Math.max(c.r, c.g, c.b) + 0.000001);
        const simpleLinealFuncion = (x1, y1, x2, y2, val) => {
            let dx = (x2 - x1) + 0.00001;
            let m = (y2 - y1) / dx;
            return m * val + (y2 - m * x2);
        };
        const limit = (num, min = 0.0, max = 1.0) => Math.max(min, Math.min(max, num));

        const operacionMatematica = (rgba, val, operacion) => {
            const v = x => Math.max(0, Math.min(1, x));
            if (operacion == "*") { rgba.r = v(rgba.r * val); rgba.g = v(rgba.g * val); rgba.b = v(rgba.b * val); }
            if (operacion == "+") { rgba.r = v(rgba.r + val); rgba.g = v(rgba.g + val); rgba.b = v(rgba.b + val); }
            return rgba;
        };

        const colorinihunyuan = (imageData) => {
            let data = imageData.data;
            let rgba = { r: 0, g: 0, b: 0 }, rgba2 = { r: 0, g: 0, b: 0 };
            let count = 0;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
                let m = Math.max(r, g, b);
                if (m > 0.3 && m < 0.7) { rgba2.r += r; rgba2.g += g; rgba2.b += b; count++; }
            }
            if (count > 0) { rgba2.r /= count; rgba2.g /= count; rgba2.b /= count; }
            for (let i = 0; i < data.length; i += 4) {
                rgba.r = data[i] / 255; rgba.g = data[i + 1] / 255; rgba.b = data[i + 2] / 255;
                let maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                operacionMatematica(rgba, (1 - limit(maxpx * 2)) * 0.1, "+");
                operacionMatematica(rgba, simpleLinealFuncion(1, 0.5, 0, 1.2, maxpx), "*");
                let dv = colorDivide(rgba);
                rgba = mixerHtmlPasaColor(rgba, rgba2, limit(simpleLinealFuncion(1, 1, 0.4, 0, dv)), true);
                data[i] = rgba.r * 255; data[i + 1] = rgba.g * 255; data[i + 2] = rgba.b * 255;
            }
            return imageData;
        };

        const meshpasonofunciona = (imageData) => {
            let data = imageData.data;
            let rgba = { r: 0, g: 0, b: 0 };
            let paso2 = confirm("mesh creator cancelar paint");
            let sum = parseFloat(prompt("suma", "0.1")) || 0.1;
            for (let i = 0; i < data.length; i += 4) {
                rgba.r = data[i] / 255; rgba.g = data[i + 1] / 255; rgba.b = data[i + 2] / 255;
                let maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                if (!paso2) {
                    operacionMatematica(rgba, simpleLinealFuncion(1, -0.3, 0, sum, maxpx), "+");
                    for (let i2 = 0; i2 < 2; i2++) saturationGio(rgba, 0.5 - colorDivide(rgba));
                } else {
                    operacionMatematica(rgba, simpleLinealFuncion(1, 0.67, 0, 1.5, limit(maxpx * 2, 0, 1)), "*");
                    operacionMatematica(rgba, (1 - maxpx) * (0.1 + sum) * maxpx, "+");
                    for (let i2 = 0; i2 < 2; i2++) saturationGio(rgba, 0.5 - colorDivide(rgba));
                }
                data[i] = rgba.r * 255; data[i + 1] = rgba.g * 255; data[i + 2] = rgba.b * 255;
            }
            return imageData;
        };

        const meshpaintcolor27112025731 = (imageData) => {
            let data = imageData.data;
            let rgba = { r: 0, g: 0, b: 0 };
            let vuelta = confirm("¿No es para blender?");
            for (let i = 0; i < data.length; i += 4) {
                rgba.r = data[i] / 255; rgba.g = data[i + 1] / 255; rgba.b = data[i + 2] / 255;
                let maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                if (vuelta) {
                    operacionMatematica(rgba, simpleLinealFuncion(1, 0, 0, 0.2, maxpx), "+");
                    saturationGio(rgba, 0.5 - colorDivide(rgba));
                    maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                    if (maxpx > 0.67) operacionMatematica(rgba, 0.67 / (maxpx + 0.000001), "*");
                    saturationGio(rgba, -colorDivide(rgba) * 0.3);
                } else {
                    operacionMatematica(rgba, (1 - maxpx) * 0.2 * maxpx, "+");
                    maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                    operacionMatematica(rgba, (1 - maxpx) * 0.2 * maxpx, "+");
                    maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                    operacionMatematica(rgba, (maxpx) * 0.2 * -maxpx, "+");
                }
                data[i] = rgba.r * 255; data[i + 1] = rgba.g * 255; data[i + 2] = rgba.b * 255;
            }
            return imageData;
        };

        const colorpasocolor3dmesh = (imageData) => {
            let data = imageData.data;
            let rgba = { r: 0, g: 0, b: 0 };
            let mul = confirm("¿Multiplicar (sum)?");
            for (let i = 0; i < data.length; i += 4) {
                rgba.r = data[i] / 255; rgba.g = data[i + 1] / 255; rgba.b = data[i + 2] / 255;
                let maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                if (mul) {
                    operacionMatematica(rgba, simpleLinealFuncion(1, 0.7, 0, 0.09, maxpx) / (maxpx + 0.000001), "*");
                } else {
                    operacionMatematica(rgba, 0.05, "+");
                    maxpx = Math.max(rgba.r, rgba.g, rgba.b);
                    if (maxpx > 0.5) operacionMatematica(rgba, 0.5 / (maxpx + 0.00001), "*");
                    saturationGio(rgba, 0.3 - colorDivide(rgba));
                    saturationGio(rgba, 0.3 - colorDivide(rgba));
                }
                data[i] = rgba.r * 255; data[i + 1] = rgba.g * 255; data[i + 2] = rgba.b * 255;
            }
            return imageData;
        };
